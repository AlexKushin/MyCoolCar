<div class="club-container">
  <div class="col-md-6 wait-list">
    <H3>Members:</H3>
    <div *ngFor="let member of carClub.members" class="user-action-container">
      <h4 class="user-name">{{ member.firstName }} {{ member.lastName }}</h4>
      <button *ngIf="member.id !== carClub.clubOwnerId" (click)="onDeleteMember(member.id)"  class="btn btn-danger">Delete member</button>
    </div>
  </div>

  <div class="col-md-6 wait-list">
    <h2>Wait List:</h2>
    <div *ngFor="let waitUser of carClub.waitList" class="user-action-container">
      <h4 class="user-name">{{ waitUser.firstName }}</h4>
      <div class="button-group">
        <button (click)="onConfirmMember(waitUser.id)" class="btn btn-success">Confirm member</button>
        <button (click)="onRefuseMember(waitUser.id)" class="btn btn-danger">Refuse member</button>
      </div>
    </div>
  </div>


</div>
<hr>
<button (click)="onDeleteCarClub()" class="btn btn-danger">Delete Club</button>
<button (click)="onDeleteCarClub()" class="btn btn-success">Edit Club Info</button>
